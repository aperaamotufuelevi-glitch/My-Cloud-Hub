<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Cloud Hub</title>
<style>body{margin:0;background:#0d1526;color:#e7edf8;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}a{color:#38bdf8}</style></head>
<body><div><h2>My Cloud Hub</h2><p id="m">Opening your hub…</p><p><a href="https://my-cloud-server.aperaamo-tufue-levi.workers.dev/">https://my-cloud-server.aperaamo-tufue-levi.workers.dev/</a></p></div>
<script>
var T="https://my-cloud-server.aperaamo-tufue-levi.workers.dev/";
function go(){
  fetch(T+'api/health',{cache:'no-store'}).then(function(r){return r.json()}).then(function(h){
    var v=String(h.version||'0').split('.').map(Number),ok=v[0]>1||(v[0]===1&&v[1]>=3);
    if(!ok){document.getElementById('m').textContent='Your server is finishing an update. This page tries again by itself.';return setTimeout(go,15000)}
    var hub=null,sec=null;try{hub=JSON.parse(localStorage.getItem('myCloudHub.v1'));sec=JSON.parse(localStorage.getItem('myCloudHub.secrets'))}catch(e){}
    if((hub||sec)&&!localStorage.getItem('myCloudHub.carried')){
      localStorage.setItem('myCloudHub.carried','1');
      location.replace(T+'#carry='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify({hub:hub,sec:sec}))))));
    }else location.replace(T);
  }).catch(function(){location.replace(T)});
}
go();
</script></body></html>
